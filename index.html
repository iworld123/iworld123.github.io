pz-face .head{position:absolute;left:50%;top:22px;width:250px;height:300px;transform:translateX(-50%);background:#ffd9a8;border:4px solid #d9a066;border-radius:48% 48% 42% 42%}\n.pz-face .hair{position:absolute;left:50%;top:10px;width:270px;height:120px;transform:translateX(-50%);background:#8b5a2b;border-radius:50% 50% 34% 34%}\n.pz-face .neck{position:absolute;left:50%;top:300px;width:70px;height:70px;transform:translateX(-50%);background:#ffd9a8;border:4px solid #d9a066;border-top:none;border-radius:0 0 20px 20px}\n.pz-face .body{position:absolute;left:50%;top:356px;width:220px;height:80px;transform:translateX(-50%);background:#60a5fa;border:4px solid #3b82f6;border-radius:22px}\n.fslot{position:absolute;z-index:5;border:4px dashed rgba(120,90,40,.75);background:rgba(255,255,255,.28);border-radius:14px;transition:.15s}\n.fslot.s-eye{width:58px;height:40px}\n.fslot.s-nose{width:44px;height:56px;border-radius:50%}\n.fslot.s-mouth{width:74px;height:34px}\n.fslot.s-ear{width:52px;height:44px}\n.fslot.hot{animation:pulse 1s infinite}\n.fslot .fi{width:100%;height:100%;display:flex;align-items:center;justify-content:center}\n.fslot .fi .ic{font-size:34px;line-height:1}\n.fslot .fi .sv{width:34px;height:34px}\n.fslot.filled{border-style:solid;border-color:#16a34a;background:#fff}\n\n/* 拼图碎片 */\n.pieces{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}\n.piece{width:120px;min-height:118px;background:#fff;border:4px solid #e5e7eb;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;transition:.12s;touch-action:none;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.06)}\n.piece .ic{font-size:56px;line-height:1}\n.piece .sv{width:62px;height:62px}\n.piece .en{font-size:15px;font-weight:800}\n.piece .zh{font-size:11px;color:#9ca3af}\n.piece.sel{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac);transform:scale(1.06)}\n.piece.used{opacity:.15;pointer-events:none;filter:grayscale(1)}\n.piece.shake{animation:shake .3s;border-color:#ef4444}\n.dghost{position:fixed;pointer-events:none;z-index:999;width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:3px dashed var(--ac);border-radius:16px;opacity:.95;transform:translate(-50%,-50%) scale(.9);box-shadow:0 8px 18px rgba(0,0,0,.25)}\n.dghost .ic{font-size:54px;line-height:1}\n.dghost .sv{width:58px;height:58px}\n\n/* 完成页 */\n.end{text-align:center;padding:40px 20px}\n.end .em{font-size:88px;line-height:1}\n.end h2{font-size:34px;margin:10px 0}\n.endbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}\n\n@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}\n@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(249,115,22,.5)}50%{box-shadow:0 0 0 9px rgba(249,115,22,.12)}}\n.fx{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}\n.fx span{position:absolute;font-size:30px;animation:up 1s ease-out forwards}\n@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-120px)}}\n.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;background:#111827;color:#fff;padding:12px 22px;border-radius:999px;font-size:18px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.3);animation:tp .2s}\n@keyframes tp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}\n@media(max-width:640px){.opt-grid{grid-template-columns:repeat(2,1fr)}.gcell{min-height:120px}.gcell .ic{font-size:52px!important}.mcard .ic{font-size:46px!important}.ttl{font-size:18px!important}}\n<\\/style>\n<\\/head>\n<body style=\"--ac:#f97316;background:#eef1f6\">\n<div class=\"topbar\"><button class=\"tbtn\" id=\"btnHome\" title=\"返回游戏列表\">🏠<small>游戏列表<\\/small><\\/button><div class=\"ttl\"><span>📚 Unit 1 · My Classroom<\\/span><span class=\"sub\">　Big Fun 1 · U1 · 我的教室<\\/span><\\/div><button class=\"tbtn\" id=\"btnVoice\" title=\"朗读开关\">🔊<small>朗读<\\/small><\\/button><button class=\"tbtn\" id=\"btnText\" title=\"字幕开关\">👁️<small>字幕<\\/small><\\/button><\\/div>\n<div id=\"screen\"><\\/div>\n<script>window.UNIT = {\"key\": \"BF1U1\", \"book\": \"Big Fun 1\", \"num\": \"U1\", \"name\": \"Unit 1 · My Classroom\", \"cn\": \"我的教室\", \"emoji\": \"📚\", \"accent\": \"#f97316\", \"file\": \"BF1_U1_My_Classroom.html\", \"sc\": {\"theme\": \"sc-classroom\", \"face\": false, \"tip\": \"听一听，把这些东西送回教室里\", \"items\": [\"crayon\", \"paper\", \"shelf\", \"puppet\", \"chair\", \"table\"], \"title\": \"\", \"deco\": [[6, 8, 60, \"🖼️\"], [84, 6, 54, \"🪟\"], [50, 74, 64, \"🧑‍🏫\"], [86, 70, 46, \"🧸\"], [8, 70, 44, \"🎨\"], [60, 40, 40, \"✏️\"]]}, \"words\": [{\"en\": \"crayon\", \"zh\": \"蜡笔\", \"icon\": \"🖍️\", \"q\": \"What is this?\", \"say\": \"What is this? It's a crayon.\"}, {\"en\": \"paper\", \"zh\": \"纸\", \"icon\": \"📄\", \"q\": \"What is this?\", \"say\": \"What is this? It's paper.\"}, {\"en\": \"shelf\", \"zh\": \"书架\", \"svg\": \"<svg viewBox=\\\"0 0 64 64\\\"><path d=\\\"M6 6 L58 6 L58 20 L6 20 Z\\\" fill=\\\"#f59e0b\\\"/><path d=\\\"M6 26 L58 26 L58 40 L6 40 Z\\\" fill=\\\"#f59e0b\\\"/><rect x=\\\"8\\\" y=\\\"7\\\" width=\\\"6\\\" height=\\\"12\\\" fill=\\\"#ef4444\\\" rx=\\\"1\\\"/><rect x=\\\"18\\\" y=\\\"7\\\" width=\\\"8\\\" height=\\\"12\\\" fill=\\\"#3b82f6\\\" rx=\\\"1\\\"/><rect x=\\\"9\\\" y=\\\"27\\\" width=\\\"10\\\" height=\\\"12\\\" fill=\\\"#22c55e\\\" rx=\\\"1\\\"/><rect x=\\\"10\\\" y=\\\"42\\\" width=\\\"44\\\" height=\\\"3\\\" fill=\\\"#92400e\\\"/><\\/svg>\", \"icon\": \"\", \"q\": \"What is this?\", \"say\": \"What is this? It's a shelf.\"}, {\"en\": \"puppet\", \"zh\": \"手偶(蓝蚂蚁)\", \"svg\": \"<svg viewBox=\\\"0 0 64 64\\\"><ellipse cx=\\\"32\\\" cy=\\\"40\\\" rx=\\\"20\\\" ry=\\\"16\\\" fill=\\\"#3b82f6\\\"/><circle cx=\\\"32\\\" cy=\\\"18\\\" r=\\\"12\\\" fill=\\\"#3b82f6\\\"/><circle cx=\\\"32\\\" cy=\\\"15\\\" r=\\\"8\\\" fill=\\\"#bfdbfe\\\"/><circle cx=\\\"28\\\" cy=\\\"14\\\" r=\\\"2.4\\\" fill=\\\"#1e3a8a\\\"/><circle cx=\\\"36\\\" cy=\\\"14\\\" r=\\\"2.4\\\" fill=\\\"#1e3a8a\\\"/><circle cx=\\\"32\\\" cy=\\\"18\\\" r=\\\"2\\\" fill=\\\"#f472b6\\\"/><path d=\\\"M32 26 l6 5 M32 26 l-6 5 M32 30 l-6 7 M32 30 l6 7\\\" stroke=\\\"#172554\\\" stroke-width=\\\"2.4\\\" stroke-linecap=\\\"round\\\"/><circle cx=\\\"17\\\" cy=\\\"46\\\" r=\\\"3\\\" fill=\\\"#1d4ed8\\\"/><circle cx=\\\"47\\\" cy=\\\"46\\\" r=\\\"3\\\" fill=\\\"#1d4ed8\\\"/><\\/svg>\", \"icon\": \"\", \"q\": \"What is this?\", \"say\": \"What is this? It's a puppet.\"}, {\"en\": \"chair\", \"zh\": \"椅子\", \"icon\": \"🪑\", \"q\": \"What is this?\", \"say\": \"What is this? It's a chair.\"}, {\"en\": \"table\", \"zh\": \"桌子\", \"svg\": \"<svg viewBox=\\\"0 0 64 64\\\"><rect x=\\\"4\\\" y=\\\"14\\\" width=\\\"56\\\" height=\\\"8\\\" rx=\\\"3\\\" fill=\\\"#b45309\\\"/><rect x=\\\"10\\\" y=\\\"22\\\" width=\\\"5\\\" height=\\\"30\\\" fill=\\\"#92400e\\\"/><rect x=\\\"49\\\" y=\\\"22\\\" width=\\\"5\\\" height=\\\"30\\\" fill=\\\"#92400e\\\"/><rect x=\\\"4\\\" y=\\\"14\\\" width=\\\"56\\\" height=\\\"8\\\" rx=\\\"3\\\" fill=\\\"none\\\" stroke=\\\"#78350f\\\" stroke-width=\\\"2\\\"/><\\/svg>\", \"icon\": \"\", \"q\": \"What is this?\", \"say\": \"What is this? It's a table.\"}, {\"en\": \"walk\", \"zh\": \"走\", \"icon\": \"🚶\"}, {\"en\": \"jump\", \"zh\": \"跳\", \"icon\": \"🤸\"}, {\"en\": \"sit down\", \"zh\": \"坐下\", \"icon\": \"🧎\"}, {\"en\": \"stand up\", \"zh\": \"起立\", \"icon\": \"🧍\"}]};\n<\\/script>\n<script>/* Big Fun 合订课堂小游戏 · 引擎 */\n\"use strict\";\nvar UNIT = window.UNIT;\nvar WORDS = UNIT.words;\nvar AC = UNIT.accent || '#f97316';\nvar $ = function(s){ return document.querySelector(s); };\nvar $$ = function(s){ return Array.from(document.querySelectorAll(s)); };\nvar screenEl = $('#screen');\nvar PREFS_KEY = 'bigfun_v2_prefs';\nvar prefs = { voice:true, text:true };\ntry{ var _p = JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); if(_p){ prefs.voice = _p.voice!==false; prefs.text = _p.text!==false; } }catch(e){}\nfunction savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }\nfunction pickN(list,n){ return shuffle(list).slice(0,n); }\nfunction byId(id){ return document.getElementById(id); }\n/* 图片 HTML */\nfunction pic(w, fs){ if(w.svg){ return '<span class=\"sv\">'+w.svg+'<\\/span>'; } return '<span class=\"ic\" style=\"font-size:'+(fs||58)+'px\">'+esc(w.icon)+'<\\/span>'; }\nfunction lbl(w){ return prefs.text ? '<span class=\"en\">'+esc(w.en)+'<\\/span><span class=\"zh\">'+esc(w.zh)+'<\\/span>' : ''; }\n/* 语音 */\nvar _speechOk=false;\nfunction pickVoice(){ try{ var vs=speechSynthesis.getVoices().filter(function(v){return /en/i.test(v.lang);}); if(!vs.length) return null; return vs.find(function(v){return /en-US/i.test(v.lang)&&/(google|aria|zira|jenny|samantha|natural|siri)/i.test(v.name);})||vs[0]; }catch(e){ return null; } }\nif('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){ _speechOk=!!pickVoice(); }; setTimeout(function(){ _speechOk=!!pickVoice(); },400); }\nfunction speak(txt){ if(!prefs.voice||!txt) return; try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(txt)); u.lang='en-US'; u.rate=0.78; u.pitch=1.05; var v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }\nfunction stopSpeak(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }\nfunction wSay(w){ return (w && w.say) ? w.say : (w ? w.en : ''); }\n/* 音效 */\nvar actx=null;\nfunction beep(freq,t0,dur){ try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } var o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.setValueAtTime(.0001,actx.currentTime+t0); g.gain.exponentialRampToValueAtTime(.22,actx.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t0+dur); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+t0); o.stop(actx.currentTime+t0+dur+.05); }catch(e){} }\nfunction sOk(){ beep(660,0,.12); beep(880,.12,.2); }\nfunction sNo(){ beep(210,0,.32); }\nfunction sTick(){ beep(520,0,.06); }\n/* 定时器管理 */\nvar timers=[];\nfunction T(fn,ms){ var id=setTimeout(function(){ var i=timers.indexOf(id); if(i>=0) timers.splice(i,1); fn(); },ms); timers.push(id); return id; }\nfunction clearTimers(){ timers.forEach(function(t){ clearTimeout(t); }); timers=[]; }\n/* 弹窗反馈 */\nfunction toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },1600); }\nfunction burst(x,y){ var f=document.createElement('div'); f.className='fx'; var es=['⭐','✨','🎉','🌟','💛']; for(var k=0;k<14;k++){ var s=document.createElement('span'); s.style.left=((x!==undefined?x:30)+Math.random()*40)+'%'; s.style.top=(y!==undefined?y:20)+'%'; s.textContent=es[k%es.length]; f.appendChild(s); } document.body.appendChild(f); setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1100); }\nfunction paint(html){ screenEl.innerHTML=html; window.scrollTo(0,0); }\nfunction gameShell(title, html){ paint('<div class=\"ghead\"><span class=\"ht\">'+esc(title)+'<\\/span><\\/div>'+html); }\nvar curGame = null;\nfunction stopGame(){ clearTimers(); stopSpeak(); removeGhost(); PUZ=null; }\n/* 首页 */\nvar GAME_LIST=[\n {id:'lp',icon:'👂',name:'听音找图',desc:'听一听 · 找到对的图片'},\n {id:'miss',icon:'🙈',name:'谁不见了',desc:'认真记 · 谁偷偷溜走啦'},\n {id:'odd',icon:'🔍',name:'找不同',desc:'三张一样 · 找出不一样'},\n {id:'fl',icon:'🎴',name:'翻翻乐',desc:'翻开两张 · 图片配对'},\n {id:'wh',icon:'🔨',name:'听音打地鼠',desc:'听到什么 · 就敲哪一个'},\n {id:'pu',icon:'🧩',name:'情景拼图',desc:'听一听 · 拖到场景里'}\n];\nfunction showHome(){\n  stopGame(); curGame=null;\n  var gs=GAME_LIST.map(function(g){\n    return '<button class=\"game-card\" data-id=\"'+g.id+'\" style=\"--gc:'+AC+'\"><span class=\"gi\">'+g.icon+'<\\/span><span class=\"gn\">'+g.name+'<\\/span><span class=\"gd\">'+g.desc+'<\\/span><\\/button>';\n  }).join('');\n  var ws=WORDS.map(function(w){ return '<span class=\"wchip\">'+pic(w,46)+lbl(w)+'<\\/span>'; }).join('');\n  paint(\n    '<div class=\"home-top\"><div class=\"big\">'+UNIT.emoji+'<\\/div><div style=\"flex:1;min-width:220px\"><h2>'+esc(UNIT.name)+'<\\/h2><p>'+esc(UNIT.cn)+' · 全班一起玩，先点下面任一个小游戏<\\/p><\\/div><\\/div>'\n    +'<div class=\"game-grid\">'+gs+'<\\/div>'\n    +'<div class=\"panel\" style=\"margin-top:16px\"><div class=\"ht\" style=\"font-size:20px\">📖 本单元单词<\\/div><div class=\"word-grid\">'+ws+'<\\/div><\\/div>');\n  $$('.game-card').forEach(function(b){ b.onclick=function(){ startGame(b.dataset.id); }; });\n}\nfunction startGame(id){\n  var g=GAME_LIST.find(function(x){return x.id===id;}); if(!g) return;\n  curGame=id;\n  var intro=document.createElement('div');\n  paint('<div class=\"panel ac\" style=\"padding:36px 22px\"><div style=\"font-size:88px\">'+g.icon+'<\\/div><h2 style=\"font-size:32px;margin:10px 0\">'+esc(g.name)+'<\\/h2><p style=\"color:#6b7280;font-size:18px;margin:6px 0 4px\">'+esc(g.desc)+'<\\/p>'\n    +'<div style=\"color:#9ca3af;font-size:14px;margin-bottom:18px\">👂 可以随时点左上角 🏠 返回游戏列表<\\/div>'\n    +'<div class=\"row center\"><button class=\"btn big\" id=\"goStart\">▶ 开始游戏<\\/button><\\/div><\\/div>');\n  byId('goStart').onclick=function(){\n    if(id==='lp'){ sListen(); }\n    else if(id==='miss'){ sMissing(); }\n    else if(id==='odd'){ sOdd(); }\n    else if(id==='fl'){ sFlip(); }\n    else if(id==='wh'){ sWhack(); }\n    else if(id==='pu'){ sPuzzle(); }\n  };\n}\nfunction endGame(title){\n  stopGame();\n  burst();\n  gameShell('<span class=\"ht\">🎉<\\/span>',\n    '<div class=\"panel end\"><div class=\"em\">🎉<\\/div><h2>'+esc(title)+' 完成啦！<\\/h2>'\n    +'<p class=\"subnote\" style=\"font-size:18px\">大家合作得真棒！点左上角 🏠 可以随时换游戏<\\/p>'\n    +'<div class=\"endbtns\"><button class=\"btn\" id=\"againBtn\">🔁 再玩一次<\\/button><button class=\"btn ghost\" id=\"homeBtn\">🏠 换一个游戏<\\/button><\\/div><\\/div>');\n  var id=curGame;\n  byId('againBtn').onclick=function(){ startGame(id); };\n  byId('homeBtn').onclick=showHome;\n}\n/* 顶栏 */\nfunction bindTop(){\n  byId('btnHome').onclick=function(){ showHome(); };\n  byId('btnVoice').onclick=function(){ prefs.voice=!prefs.voice; savePrefs(); byId('btnVoice').classList.toggle('on',prefs.voice); toast(prefs.voice?'🔊 朗读已开':'🔇 朗读已关'); };\n  byId('btnText').onclick=function(){ prefs.text=!prefs.text; savePrefs(); byId('btnText').classList.toggle('on',prefs.text); toast(prefs.text?'👁 显示英文':'🙈 只显示图片'); if(curGame && curGame==='pu'){ sPuzzle(); } };\n  try{ byId('btnVoice').classList.toggle('on',prefs.voice); byId('btnText').classList.toggle('on',prefs.text); }catch(e){}\n}\n/* ① 听音找图 */\nfunction tapGame(cfg){\n  var st={n:0,lock:false,target:null,opts:[]};\n  function ask(){\n    if(st.n>=cfg.total){ endGame(cfg.name); return; }\n    st.n++; st.lock=false;\n    var t=pickN(WORDS,1)[0];\n    var rest=shuffle(WORDS.filter(function(x){ return x.en!==t.en; })).slice(0,3);\n    st.target=t; st.opts=shuffle([t].concat(rest));\n    render();\n    if(t.auto!==false) T(function(){ if(st.lock===false && !cfg.stopped) speak(wSay(t)); },700);\n  }\n  function render(){\n    var t=st.target;\n    var qline = (t.q) ? '<div class=\"qline\">'+esc(t.q)+'<\\/div>' : '';\n    gameShell(cfg.name,\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">'+cfg.ico+' '+cfg.name+'<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+cfg.total+' 题<\\/span><\\/div>'\n      +qline\n      +'<div class=\"ask-t\">'+cfg.tip+'<\\/div>'\n      +'<div class=\"ac\" style=\"margin:12px 0\"><button class=\"speak big\" id=\"reSpeak\">🔊<small>点我听<\\/small><\\/button><\\/div>'\n      +'<div class=\"opt-grid\">'+st.opts.map(function(w,i){ return '<button class=\"gcell\" data-i=\"'+i+'\"><span class=\"pic\">'+pic(w,72)+'<\\/span>'+lbl(w)+'<\\/button>'; }).join('')+'<\\/div><\\/div>');\n    byId('reSpeak').onclick=function(){ speak(wSay(t)); };\n    $$('.gcell').forEach(function(c){\n      c.onclick=function(){\n        if(st.lock) return;\n        var i=+c.dataset.i;\n        if(st.opts[i].en===t.en){\n          st.lock=true; c.classList.add('ok'); sOk(); burst(50,45);\n          speak(wSay(t));\n          T(function(){ if(!cfg.stopped) ask(); },1000);\n        }else{\n          c.classList.add('no'); sNo();\n          T(function(){ if(c.classList.contains('no')) c.classList.remove('no'); },400);\n          T(function(){ speak(wSay(t)); },650);\n        }\n      };\n    });\n  }\n  cfg.stopped=false;\n  ask();\n}\nfunction stopTap(cfg){ if(cfg) cfg.stopped=true; clearTimers(); }\nfunction sListen(){\n  var cfg={ico:'👂',name:'听音找图',tip:'听一听声音，再点出正确的图片',total:8};\n  var g={start:function(){ tapGame(cfg); },stop:function(){ stopTap(cfg); }};\n  GAME_CTX=g; g.start();\n}\n/* ② 谁不见了 */\nfunction sMissing(){\n  var st={n:0,total:6,set:[],gone:null,goneIdx:-1,phase:'mem'};\n  function nextRound(){\n    if(st.n>=st.total){ endGame('谁不见了'); return; }\n    st.n++;\n    st.set=pickN(WORDS,4);\n    st.goneIdx=Math.floor(Math.random()*4);\n    st.gone=st.set[st.goneIdx];\n    mem();\n  }\n  function mem(){\n    st.phase='mem';\n    gameShell('谁不见了',\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">🙈 谁不见了<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+st.total+' 轮<\\/span><\\/div>'\n      +'<div class=\"ask-t\">👀 快看快记，记住这 4 张图片！<\\/div>'\n      +'<div class=\"mem4\" style=\"margin-top:14px\">'+st.set.map(function(w,i){ return '<div class=\"mcard\" data-m=\"'+i+'\">'+pic(w,62)+lbl(w)+'<\\/div>'; }).join( mes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}\n@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(249,115,22,.5)}50%{box-shadow:0 0 0 9px rgba(249,115,22,.12)}}\n.fx{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}\n.fx span{position:absolute;font-size:30px;animation:up 1s ease-out forwards}\n@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-120px)}}\n.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;background:#111827;color:#fff;padding:12px 22px;border-radius:999px;font-size:18px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.3);animation:tp .2s}\n@keyframes tp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}\n@media(max-width:640px){.opt-grid{grid-template-columns:repeat(2,1fr)}.gcell{min-height:120px}.gcell .ic{font-size:52px!important}.mcard .ic{font-size:46px!important}.ttl{font-size:18px!important}}\n<\\/style>\n<\\/head>\n<body style=\"--ac:#f43f5e;background:#eef1f6\">\n<div class=\"topbar\"><button class=\"tbtn\" id=\"btnHome\" title=\"返回游戏列表\">🏠<small>游戏列表<\\/small><\\/button><div class=\"ttl\"><span>👀 Unit 2 · My Body<\\/span><span class=\"sub\">　Big Fun 1 · U2 · 我的身体<\\/span><\\/div><button class=\"tbtn\" id=\"btnVoice\" title=\"朗读开关\">🔊<small>朗读<\\/small><\\/button><button class=\"tbtn\" id=\"btnText\" title=\"字幕开关\">👁️<small>字幕<\\/small><\\/button><\\/div>\n<div id=\"screen\"><\\/div>\n<script>window.UNIT = {\"key\": \"BF1U2\", \"book\": \"Big Fun 1\", \"num\": \"U2\", \"name\": \"Unit 2 · My Body\", \"cn\": \"我的身体\", \"emoji\": \"👀\", \"accent\": \"#f43f5e\", \"file\": \"BF1_U2_My_Body.html\", \"sc\": {\"theme\": \"sc-face\", \"face\": true, \"tip\": \"听一听，把五官贴到小脸上正确的位置\", \"items\": [], \"title\": \"\", \"deco\": []}, \"words\": [{\"en\": \"eyes\", \"zh\": \"眼睛\", \"icon\": \"👀\"}, {\"en\": \"ears\", \"zh\": \"耳朵\", \"icon\": \"👂\"}, {\"en\": \"nose\", \"zh\": \"鼻子\", \"icon\": \"👃\"}, {\"en\": \"mouth\", \"zh\": \"嘴巴\", \"icon\": \"👄\"}, {\"en\": \"hands\", \"zh\": \"手\", \"icon\": \"✋\"}, {\"en\": \"feet\", \"zh\": \"脚\", \"icon\": \"🦶\"}, {\"en\": \"body\", \"zh\": \"身体\", \"icon\": \"🧍\"}]};\n<\\/script>\n<script>/* Big Fun 合订课堂小游戏 · 引擎 */\n\"use strict\";\nvar UNIT = window.UNIT;\nvar WORDS = UNIT.words;\nvar AC = UNIT.accent || '#f97316';\nvar $ = function(s){ return document.querySelector(s); };\nvar $$ = function(s){ return Array.from(document.querySelectorAll(s)); };\nvar screenEl = $('#screen');\nvar PREFS_KEY = 'bigfun_v2_prefs';\nvar prefs = { voice:true, text:true };\ntry{ var _p = JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); if(_p){ prefs.voice = _p.voice!==false; prefs.text = _p.text!==false; } }catch(e){}\nfunction savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }\nfunction pickN(list,n){ return shuffle(list).slice(0,n); }\nfunction byId(id){ return document.getElementById(id); }\n/* 图片 HTML */\nfunction pic(w, fs){ if(w.svg){ return '<span class=\"sv\">'+w.svg+'<\\/span>'; } return '<span class=\"ic\" style=\"font-size:'+(fs||58)+'px\">'+esc(w.icon)+'<\\/span>'; }\nfunction lbl(w){ return prefs.text ? '<span class=\"en\">'+esc(w.en)+'<\\/span><span class=\"zh\">'+esc(w.zh)+'<\\/span>' : ''; }\n/* 语音 */\nvar _speechOk=false;\nfunction pickVoice(){ try{ var vs=speechSynthesis.getVoices().filter(function(v){return /en/i.test(v.lang);}); if(!vs.length) return null; return vs.find(function(v){return /en-US/i.test(v.lang)&&/(google|aria|zira|jenny|samantha|natural|siri)/i.test(v.name);})||vs[0]; }catch(e){ return null; } }\nif('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){ _speechOk=!!pickVoice(); }; setTimeout(function(){ _speechOk=!!pickVoice(); },400); }\nfunction speak(txt){ if(!prefs.voice||!txt) return; try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(txt)); u.lang='en-US'; u.rate=0.78; u.pitch=1.05; var v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }\nfunction stopSpeak(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }\nfunction wSay(w){ return (w && w.say) ? w.say : (w ? w.en : ''); }\n/* 音效 */\nvar actx=null;\nfunction beep(freq,t0,dur){ try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } var o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.setValueAtTime(.0001,actx.currentTime+t0); g.gain.exponentialRampToValueAtTime(.22,actx.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t0+dur); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+t0); o.stop(actx.currentTime+t0+dur+.05); }catch(e){} }\nfunction sOk(){ beep(660,0,.12); beep(880,.12,.2); }\nfunction sNo(){ beep(210,0,.32); }\nfunction sTick(){ beep(520,0,.06); }\n/* 定时器管理 */\nvar timers=[];\nfunction T(fn,ms){ var id=setTimeout(function(){ var i=timers.indexOf(id); if(i>=0) timers.splice(i,1); fn(); },ms); timers.push(id); return id; }\nfunction clearTimers(){ timers.forEach(function(t){ clearTimeout(t); }); timers=[]; }\n/* 弹窗反馈 */\nfunction toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },1600); }\nfunction burst(x,y){ var f=document.createElement('div'); f.className='fx'; var es=['⭐','✨','🎉','🌟','💛']; for(var k=0;k<14;k++){ var s=document.createElement('span'); s.style.left=((x!==undefined?x:30)+Math.random()*40)+'%'; s.style.top=(y!==undefined?y:20)+'%'; s.textContent=es[k%es.length]; f.appendChild(s); } document.body.appendChild(f); setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1100); }\nfunction paint(html){ screenEl.innerHTML=html; window.scrollTo(0,0); }\nfunction gameShell(title, html){ paint('<div class=\"ghead\"><span class=\"ht\">'+esc(title)+'<\\/span><\\/div>'+html); }\nvar curGame = null;\nfunction stopGame(){ clearTimers(); stopSpeak(); removeGhost(); PUZ=null; }\n/* 首页 */\nvar GAME_LIST=[\n {id:'lp',icon:'👂',name:'听音找图',desc:'听一听 · 找到对的图片'},\n {id:'miss',icon:'🙈',name:'谁不见了',desc:'认真记 · 谁偷偷溜走啦'},\n {id:'odd',icon:'🔍',name:'找不同',desc:'三张一样 · 找出不一样'},\n {id:'fl',icon:'🎴',name:'翻翻乐',desc:'翻开两张 · 图片配对'},\n {id:'wh',icon:'🔨',name:'听音打地鼠',desc:'听到什么 · 就敲哪一个'},\n {id:'pu',icon:'🧩',name:'情景拼图',desc:'听一听 · 拖到场景里'}\n];\nfunction showHome(){\n  stopGame(); curGame=null;\n  var gs=GAME_LIST.map(function(g){\n    return '<button class=\"game-card\" data-id=\"'+g.id+'\" style=\"--gc:'+AC+'\"><span class=\"gi\">'+g.icon+'<\\/span><span class=\"gn\">'+g.name+'<\\/span><span class=\"gd\">'+g.desc+'<\\/span><\\/button>';\n  }).join('');\n  var ws=WORDS.map(function(w){ return '<span class=\"wchip\">'+pic(w,46)+lbl(w)+'<\\/span>'; }).join('');\n  paint(\n    '<div class=\"home-top\"><div class=\"big\">'+UNIT.emoji+'<\\/div><div style=\"flex:1;min-width:220px\"><h2>'+esc(UNIT.name)+'<\\/h2><p>'+esc(UNIT.cn)+' · 全班一起玩，先点下面任一个小游戏<\\/p><\\/div><\\/div>'\n    +'<div class=\"game-grid\">'+gs+'<\\/div>'\n    +'<div class=\"panel\" style=\"margin-top:16px\"><div class=\"ht\" style=\"font-size:20px\">📖 本单元单词<\\/div><div class=\"word-grid\">'+ws+'<\\/div><\\/div>');\n  $$('.game-card').forEach(function(b){ b.onclick=function(){ startGame(b.dataset.id); }; });\n}\nfunction startGame(id){\n  var g=GAME_LIST.find(function(x){return x.id===id;}); if(!g) return;\n  curGame=id;\n  var intro=document.createElement('div');\n  paint('<div class=\"panel ac\" style=\"padding:36px 22px\"><div style=\"font-size:88px\">'+g.icon+'<\\/div><h2 style=\"font-size:32px;margin:10px 0\">'+esc(g.name)+'<\\/h2><p style=\"color:#6b7280;font-size:18px;margin:6px 0 4px\">'+esc(g.desc)+'<\\/p>'\n    +'<div style=\"color:#9ca3af;font-size:14px;margin-bottom:18px\">👂 可以随时点左上角 🏠 返回游戏列表<\\/div>'\n    +'<div class=\"row center\"><button class=\"btn big\" id=\"goStart\">▶ 开始游戏<\\/button><\\/div><\\/div>');\n  byId('goStart').onclick=function(){\n    if(id==='lp'){ sListen(); }\n    else if(id==='miss'){ sMissing(); }\n    else if(id==='odd'){ sOdd(); }\n    else if(id==='fl'){ sFlip(); }\n    else if(id==='wh'){ sWhack(); }\n    else if(id==='pu'){ sPuzzle(); }\n  };\n}\nfunction endGame(title){\n  stopGame();\n  burst();\n  gameShell('<span class=\"ht\">🎉<\\/span>',\n    '<div class=\"panel end\"><div class=\"em\">🎉<\\/div><h2>'+esc(title)+' 完成啦！<\\/h2>'\n    +'<p class=\"subnote\" style=\"font-size:18px\">大家合作得真棒！点左上角 🏠 可以随时换游戏<\\/p>'\n    +'<div class=\"endbtns\"><button class=\"btn\" id=\"againBtn\">🔁 再玩一次<\\/button><button class=\"btn ghost\" id=\"homeBtn\">🏠 换一个游戏<\\/button><\\/div><\\/div>');\n  var id=curGame;\n  byId('againBtn').onclick=function(){ startGame(id); };\n  byId('homeBtn').onclick=showHome;\n}\n/* 顶栏 */\nfunction bindTop(){\n  byId('btnHome').onclick=function(){ showHome(); };\n  byId('btnVoice').onclick=function(){ prefs.voice=!prefs.voice; savePrefs(); byId('btnVoice').classList.toggle('on',prefs.voice); toast(prefs.voice?'🔊 朗读已开':'🔇 朗读已关'); };\n  byId('btnText').onclick=function(){ prefs.text=!prefs.text; savePrefs(); byId('btnText').classList.toggle('on',prefs.text); toast(prefs.text?'👁 显示英文':'🙈 只显示图片'); if(curGame && curGame==='pu'){ sPuzzle(); } };\n  try{ byId('btnVoice').classList.toggle('on',prefs.voice); byId('btnText').classList.toggle('on',prefs.text); }catch(e){}\n}\n/* ① 听音找图 */\nfunction tapGame(cfg){\n  var st={n:0,lock:false,target:null,opts:[]};\n  function ask(){\n    if(st.n>=cfg.total){ endGame(cfg.name); return; }\n    st.n++; st.lock=false;\n    var t=pickN(WORDS,1)[0];\n    var rest=shuffle(WORDS.filter(function(x){ return x.en!==t.en; })).slice(0,3);\n    st.target=t; st.opts=shuffle([t].concat(rest));\n    render();\n    if(t.auto!==false) T(function(){ if(st.lock===false && !cfg.stopped) speak(wSay(t)); },700);\n  }\n  function render(){\n    var t=st.target;\n    var qline = (t.q) ? '<div class=\"qline\">'+esc(t.q)+'<\\/div>' : '';\n    gameShell(cfg.name,\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">'+cfg.ico+' '+cfg.name+'<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+cfg.total+' 题<\\/span><\\/div>'\n      +qline\n      +'<div class=\"ask-t\">'+cfg.tip+'<\\/div>'\n      +'<div class=\"ac\" style=\"margin:12px 0\"><button class=\"speak big\" id=\"reSpeak\">🔊<small>点我听<\\/small><\\/button><\\/div>'\n      +'<div class=\"opt-grid\">'+st.opts.map(function(w,i){ return '<button class=\"gcell\" data-i=\"'+i+'\"><span class=\"pic\">'+pic(w,72)+'<\\/span>'+lbl(w)+'<\\/button>'; }).join('')+'<\\/div><\\/div>');\n    byId('reSpeak').onclick=function(){ speak(wSay(t)); };\n    $$('.gcell').forEach(function(c){\n      c.onclick=function(){\n        if(st.lock) return;\n        var i=+c.dataset.i;\n        if(st.opts[i].en===t.en){\n          st.lock=true; c.classList.add('ok'); sOk(); burst(50,45);\n          speak(wSay(t));\n          T(function(){ if(!cfg.stopped) ask(); },1000);\n        }else{\n          c.classList.add('no'); sNo();\n          T(function(){ if(c.classList.contains('no')) c.classList.remove('no'); },400);\n          T(function(){ speak(wSay(t)); },650);\n        }\n      };\n    });\n  }\n  cfg.stopped=false;\n  ask();\n}\nfunction stopTap(cfg){ if(cfg) cfg.stopped=true; clearTimers(); }\nfunction sListen(){\n  var cfg={ico:'👂',name:'听音找图',tip:'听一听声音，再点出正确的图片',total:8};\n  var g={start:function(){ tapGame(cfg); },stop:function(){ stopTap(cfg); }};\n  GAME_CTX=g; g.start();\n}\n/* ② 谁不见了 */\nfunction sMissing(){\n  var st={n:0,tota pan>👨‍👩‍👧‍👦 Unit 3 · My Family<\\/span><span class=\"sub\">　Big Fun 1 · U3 · 我的家人<\\/span><\\/div><button class=\"tbtn\" id=\"btnVoice\" title=\"朗读开关\">🔊<small>朗读<\\/small><\\/button><button class=\"tbtn\" id=\"btnText\" title=\"字幕开关\">👁️<small>字幕<\\/small><\\/button><\\/div>\n<div id=\"screen\"><\\/div>\n<script>window.UNIT = {\"key\": \"BF1U3\", \"book\": \"Big Fun 1\", \"num\": \"U3\", \"name\": \"Unit 3 · My Family\", \"cn\": \"我的家人\", \"emoji\": \"👨‍👩‍👧‍👦\", \"accent\": \"#ec4899\", \"file\": \"BF1_U3_My_Family.html\", \"sc\": {\"theme\": \"sc-family\", \"face\": false, \"tip\": \"听一听，让家人一起拍全家福\", \"items\": [\"father\", \"mother\", \"brother\", \"sister\", \"baby\", \"grandmother\", \"grandfather\", \"grandparents\"], \"title\": \"\", \"deco\": [[8, 8, 56, \"🛋️\"], [84, 10, 52, \"🪴\"], [70, 72, 52, \"🧸\"], [6, 72, 44, \"🖼️\"], [88, 44, 40, \"🌷\"]]}, \"words\": [{\"en\": \"grandfather\", \"zh\": \"爷爷\", \"icon\": \"👴\"}, {\"en\": \"grandmother\", \"zh\": \"奶奶\", \"icon\": \"👵\"}, {\"en\": \"grandparents\", \"zh\": \"祖父母\", \"icon\": \"👴👵\"}, {\"en\": \"father\", \"zh\": \"爸爸\", \"icon\": \"👨\"}, {\"en\": \"mother\", \"zh\": \"妈妈\", \"icon\": \"👩\"}, {\"en\": \"baby\", \"zh\": \"宝宝\", \"icon\": \"👶\"}, {\"en\": \"brother\", \"zh\": \"哥哥\", \"icon\": \"👦\"}, {\"en\": \"sister\", \"zh\": \"姐姐\", \"icon\": \"👧\"}, {\"en\": \"family\", \"zh\": \"家人\", \"icon\": \"👨‍👩‍👧‍👦\"}]};\n<\\/script>\n<script>/* Big Fun 合订课堂小游戏 · 引擎 */\n\"use strict\";\nvar UNIT = window.UNIT;\nvar WORDS = UNIT.words;\nvar AC = UNIT.accent || '#f97316';\nvar $ = function(s){ return document.querySelector(s); };\nvar $$ = function(s){ return Array.from(document.querySelectorAll(s)); };\nvar screenEl = $('#screen');\nvar PREFS_KEY = 'bigfun_v2_prefs';\nvar prefs = { voice:true, text:true };\ntry{ var _p = JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); if(_p){ prefs.voice = _p.voice!==false; prefs.text = _p.text!==false; } }catch(e){}\nfunction savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }\nfunction pickN(list,n){ return shuffle(list).slice(0,n); }\nfunction byId(id){ return document.getElementById(id); }\n/* 图片 HTML */\nfunction pic(w, fs){ if(w.svg){ return '<span class=\"sv\">'+w.svg+'<\\/span>'; } return '<span class=\"ic\" style=\"font-size:'+(fs||58)+'px\">'+esc(w.icon)+'<\\/span>'; }\nfunction lbl(w){ return prefs.text ? '<span class=\"en\">'+esc(w.en)+'<\\/span><span class=\"zh\">'+esc(w.zh)+'<\\/span>' : ''; }\n/* 语音 */\nvar _speechOk=false;\nfunction pickVoice(){ try{ var vs=speechSynthesis.getVoices().filter(function(v){return /en/i.test(v.lang);}); if(!vs.length) return null; return vs.find(function(v){return /en-US/i.test(v.lang)&&/(google|aria|zira|jenny|samantha|natural|siri)/i.test(v.name);})||vs[0]; }catch(e){ return null; } }\nif('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){ _speechOk=!!pickVoice(); }; setTimeout(function(){ _speechOk=!!pickVoice(); },400); }\nfunction speak(txt){ if(!prefs.voice||!txt) return; try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(txt)); u.lang='en-US'; u.rate=0.78; u.pitch=1.05; var v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }\nfunction stopSpeak(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }\nfunction wSay(w){ return (w && w.say) ? w.say : (w ? w.en : ''); }\n/* 音效 */\nvar actx=null;\nfunction beep(freq,t0,dur){ try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } var o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.setValueAtTime(.0001,actx.currentTime+t0); g.gain.exponentialRampToValueAtTime(.22,actx.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t0+dur); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+t0); o.stop(actx.currentTime+t0+dur+.05); }catch(e){} }\nfunction sOk(){ beep(660,0,.12); beep(880,.12,.2); }\nfunction sNo(){ beep(210,0,.32); }\nfunction sTick(){ beep(520,0,.06); }\n/* 定时器管理 */\nvar timers=[];\nfunction T(fn,ms){ var id=setTimeout(function(){ var i=timers.indexOf(id); if(i>=0) timers.splice(i,1); fn(); },ms); timers.push(id); return id; }\nfunction clearTimers(){ timers.forEach(function(t){ clearTimeout(t); }); timers=[]; }\n/* 弹窗反馈 */\nfunction toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },1600); }\nfunction burst(x,y){ var f=document.createElement('div'); f.className='fx'; var es=['⭐','✨','🎉','🌟','💛']; for(var k=0;k<14;k++){ var s=document.createElement('span'); s.style.left=((x!==undefined?x:30)+Math.random()*40)+'%'; s.style.top=(y!==undefined?y:20)+'%'; s.textContent=es[k%es.length]; f.appendChild(s); } document.body.appendChild(f); setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1100); }\nfunction paint(html){ screenEl.innerHTML=html; window.scrollTo(0,0); }\nfunction gameShell(title, html){ paint('<div class=\"ghead\"><span class=\"ht\">'+esc(title)+'<\\/span><\\/div>'+html); }\nvar curGame = null;\nfunction stopGame(){ clearTimers(); stopSpeak(); removeGhost(); PUZ=null; }\n/* 首页 */\nvar GAME_LIST=[\n {id:'lp',icon:'👂',name:'听音找图',desc:'听一听 · 找到对的图片'},\n {id:'miss',icon:'🙈',name:'谁不见了',desc:'认真记 · 谁偷偷溜走啦'},\n {id:'odd',icon:'🔍',name:'找不同',desc:'三张一样 · 找出不一样'},\n {id:'fl',icon:'🎴',name:'翻翻乐',desc:'翻开两张 · 图片配对'},\n {id:'wh',icon:'🔨',name:'听音打地鼠',desc:'听到什么 · 就敲哪一个'},\n {id:'pu',icon:'🧩',name:'情景拼图',desc:'听一听 · 拖到场景里'}\n];\nfunction showHome(){\n  stopGame(); curGame=null;\n  var gs=GAME_LIST.map(function(g){\n    return '<button class=\"game-card\" data-id=\"'+g.id+'\" style=\"--gc:'+AC+'\"><span class=\"gi\">'+g.icon+'<\\/span><span class=\"gn\">'+g.name+'<\\/span><span class=\"gd\">'+g.desc+'<\\/span><\\/button>';\n  }).join('');\n  var ws=WORDS.map(function(w){ return '<span class=\"wchip\">'+pic(w,46)+lbl(w)+'<\\/span>'; }).join('');\n  paint(\n    '<div class=\"home-top\"><div class=\"big\">'+UNIT.emoji+'<\\/div><div style=\"flex:1;min-width:220px\"><h2>'+esc(UNIT.name)+'<\\/h2><p>'+esc(UNIT.cn)+' · 全班一起玩，先点下面任一个小游戏<\\/p><\\/div><\\/div>'\n    +'<div class=\"game-grid\">'+gs+'<\\/div>'\n    +'<div class=\"panel\" style=\"margin-top:16px\"><div class=\"ht\" style=\"font-size:20px\">📖 本单元单词<\\/div><div class=\"word-grid\">'+ws+'<\\/div><\\/div>');\n  $$('.game-card').forEach(function(b){ b.onclick=function(){ startGame(b.dataset.id); }; });\n}\nfunction startGame(id){\n  var g=GAME_LIST.find(function(x){return x.id===id;}); if(!g) return;\n  curGame=id;\n  var intro=document.createElement('div');\n  paint('<div class=\"panel ac\" style=\"padding:36px 22px\"><div style=\"font-size:88px\">'+g.icon+'<\\/div><h2 style=\"font-size:32px;margin:10px 0\">'+esc(g.name)+'<\\/h2><p style=\"color:#6b7280;font-size:18px;margin:6px 0 4px\">'+esc(g.desc)+'<\\/p>'\n    +'<div style=\"color:#9ca3af;font-size:14px;margin-bottom:18px\">👂 可以随时点左上角 🏠 返回游戏列表<\\/div>'\n    +'<div class=\"row center\"><button class=\"btn big\" id=\"goStart\">▶ 开始游戏<\\/button><\\/div><\\/div>');\n  byId('goStart').onclick=function(){\n    if(id==='lp'){ sListen(); }\n    else if(id==='miss'){ sMissing(); }\n    else if(id==='odd'){ sOdd(); }\n    else if(id==='fl'){ sFlip(); }\n    else if(id==='wh'){ sWhack(); }\n    else if(id==='pu'){ sPuzzle(); }\n  };\n}\nfunction endGame(title){\n  stopGame();\n  burst();\n  gameShell('<span class=\"ht\">🎉<\\/span>',\n    '<div class=\"panel end\"><div class=\"em\">🎉<\\/div><h2>'+esc(title)+' 完成啦！<\\/h2>'\n    +'<p class=\"subnote\" style=\"font-size:18px\">大家合作得真棒！点左上角 🏠 可以随时换游戏<\\/p>'\n    +'<div class=\"endbtns\"><button class=\"btn\" id=\"againBtn\">🔁 再玩一次<\\/button><button class=\"btn ghost\" id=\"homeBtn\">🏠 换一个游戏<\\/button><\\/div><\\/div>');\n  var id=curGame;\n  byId('againBtn').onclick=function(){ startGame(id); };\n  byId('homeBtn').onclick=showHome;\n}\n/* 顶栏 */\nfunction bindTop(){\n  byId('btnHome').onclick=function(){ showHome(); };\n  byId('btnVoice').onclick=function(){ prefs.voice=!prefs.voice; savePrefs(); byId('btnVoice').classList.toggle('on',prefs.voice); toast(prefs.voice?'🔊 朗读已开':'🔇 朗读已关'); };\n  byId('btnText').onclick=function(){ prefs.text=!prefs.text; savePrefs(); byId('btnText').classList.toggle('on',prefs.text); toast(prefs.text?'👁 显示英文':'🙈 只显示图片'); if(curGame && curGame==='pu'){ sPuzzle(); } };\n  try{ byId('btnVoice').classList.toggle('on',prefs.voice); byId('btnText').classList.toggle('on',prefs.text); }catch(e){}\n}\n/* ① 听音找图 */\nfunction tapGame(cfg){\n  var st={n:0,lock:false,target:null,opts:[]};\n  function ask(){\n    if(st.n>=cfg.total){ endGame(cfg.name); return; }\n    st.n++; st.lock=false;\n    var t=pickN(WORDS,1)[0];\n    var rest=shuffle(WORDS.filter(function(x){ return x.en!==t.en; })).slice(0,3);\n    st.target=t; st.opts=shuffle([t].concat(rest));\n    render();\n    if(t.auto!==false) T(function(){ if(st.lock===false && !cfg.stopped) speak(wSay(t)); },700);\n  }\n  function render(){\n    var t=st.target;\n    var qline = (t.q) ? '<div class=\"qline\">'+esc(t.q)+'<\\/div>' : '';\n    gameShell(cfg.name,\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">'+cfg.ico+' '+cfg.name+'<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+cfg.total+' 题<\\/span><\\/div>'\n      +qline\n      +'<div class=\"ask-t\">'+cfg.tip+'<\\/div>'\n      +'<div class=\"ac\" style=\"margin:12px 0\"><button class=\"speak big\" id=\"reSpeak\">🔊<small>点我听<\\/small><\\/button><\\/div>'\n      +'<div class=\"opt-grid\">'+st.opts.map(function(w,i){ return '<button class=\"gcell\" data-i=\"'+i+'\"><span class=\"pic\">'+pic(w,72)+'<\\/span>'+lbl(w)+'<\\/button>'; }).join('')+'<\\/div><\\/div>');\n    byId('reSpeak').onclick=function(){ speak(wSay(t)); };\n    $$('.gcell').forEach(function(c){\n      c.onclick=function(){\n        if(st.lock) return;\n        var i=+c.dataset.i;\n        if(st.opts[i].en===t.en){\n          st.lock=true; c.classList.add('ok'); sOk(); burst(50,45);\n          speak(wSay(t));\n          T(function(){ if(!cfg.stopped) ask(); },1000);\n        }else{\n          c.classList.add('no'); sNo();\n          T(function(){ if(c.classList.contains('no')) c.classList.remove('no'); },400);\n          T(function(){ speak(wSay(t)); },650);\n        }\n      };\n    });\n  }\n  cfg.stopped=false;\n  ask();\n}\nfunction stopTap(cfg){ if(cfg) cfg.stopped=true; clearTimers(); }\nfunction sListen(){\n  var cfg={ico:'👂',name:'听音找图',tip:'听一听声音，再点出正确的图片',total:8};\n  var g={start:function(){ tapGame(cfg); },stop:function(){ stopTap(cfg); }};\n  GAME_CTX=g; g.start();\n}\n/* ② 谁不见了 */\nfunction sMissing(){\n  var st={n:0,total:6,set:[],gone:null,goneIdx:-1,phase:'mem'};\n  function nextRound(){\n    if(st.n>=st.total){ endGame('谁不见了'); return; }\n    st.n++;\n    st.set=pickN(WORDS,4);\n    st.goneIdx=Math.floor(Math.random()*4);\n    st.gone=st.set[st.goneIdx];\n    mem();\n  }\n  function mem(){\n    st.phase='mem';\n    gameShell('谁不见了',\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">🙈 谁不见了<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+st.total+' 轮<\\/span><\\/div>'\n      +'<div class=\"ask-t\">👀 快看快记，记住这 4 张图片！<\\/div>'\n      +'<div class=\"mem4\" style=\"margin-top:14px\">'+st.set.map(function(w,i){ return '<div class=\"mcard\" data-m=\"'+i+'\">'+pic(w,62)+lbl(w)+'<\\/div>'; }).join('')+'<\\/div><\\/div>');\n    T(function(){ flyAway(); },2600);\n  }\n  function flyAway(){\n    if(st.phase!=='mem') return;\n    var c=document.querySelector('.mcard[data-m=\"'+st.goneIdx+'\"]');\n    if(c) c.classList.add('fly');\n    T(function(){ ask(); },1000);\n  }\n  function ask(){\n    st.phase='ask';\n    var cells=[0,1,2,3];\n    gameShell('谁不见了',\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">🙈 谁不见了<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+st.total+' 轮<\\/span><\\/div>'\n      +'<div class=\"ask-t\">🤔 哪一个溜走不见了？点一点它<\\/div>'\n      +'<div class=\"mem4\" style=\"margin-top:14px\">'+cells.map(function(i){\n         if(i===st.goneIdx){ return '<div class=\"mcard gone\"><span class=\"empty-q\">❓<\\/span><\\/div>'; }\n         return '<div class=\"mcard\">'+pic(st.set[i],62)+lbl(st.set[i])+'<\\/div>';\n        }).join('')+'<\\/div>'\n      +'<div class=\"pieces\" style=\"margin-top:16px\">'+shuffle(st.set).map(function(w,i){ return '<button class=\"piece\" data-i=\"'+i+'\" data-en=\"'+esc(w.en)+'\">'+pic(w,54)+'<\\/button>'; }).join('')+'<\\/div><\\/div>');\n    $$('.pieces .piece').forEach(function(p){\n      p.onclick=function(){\n        if(st.phase!=='ask') return;\n        if(p.dataset.en===st.gone.en){ st.phase='done'; p.classList.add('ok'); sOk(); burst(50,50);\n          T(nextRound,900);\n        }else{ p.classList.add('shake'); sNo(); T(function(){ p.classList.remove('shake'); },400); }\n      };\n    });\n  }\n  nextRound();\n}\n/* ③ 找不同 */\nfunction sOdd(){\n  var st={n:0,lock:false,ans:0};\n  function ask(){\n    if(st.n>=6){ endGame('找不同'); return; }\n    st.n++; st.lock=false;\n    var a=pickN(WORDS,1)[0];\n    var rest=WORDS.filter(function(x){ return x.en!==a.en; });\n    var b=pickN(rest,1)[0];\n    var items=shuffle([a,a,a,b]);\n    st.ans=items.findIndex(function(x){ return x.en===b.en; });\n    gameShell('找不同',\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">🔍 找不同<\\/span><span class=\"qbar qb2\">第 '+st.n+' / 6 题<\\/span><\\/div>'\n      +'<div class=\"ask-t\">三张一样的图里混进了不同的一个，点出它！<\\/div>'\n      +'<div class=\"opt-grid\" style=\"margin-top:14px\">'+items.map(function(w,i){ return '<button class=\"gcell\" data-i=\"'+i+'\"><span class=\"pic\">'+pic(w,72)+'<\\/span>'+lbl(w)+'<\\/button>'; }).join('')+'<\\/div><\\/div>');\n    $$('.gcell').forEach(function(c){\n      c.onclick=function(){\n        if(st.lock) return;\n        if(+c.dataset.i===st.ans){ st.lock=true; c.classList.add('ok'); sOk(); burst(50,50); T(ask,950); }\n        else{ c.classList.add('no'); sNo(); T(function(){ c.classList.remove('no'); },400); }\n      };\n    });\n  }\n  ask();\n}\n/* ④ 翻翻乐 */\nfunction sFlip(){\n  var st={round:1,total:3,moves:0};\n  function board(){\n    var words=pickN(WORDS,4);\n    var deck=shuffle(words.concat(words.slice()));\n    var state=deck.map(function(w){ return {w:w,open:false,done:false}; });\n    var open1=null; var lock=false;\n    function render(){\n      gameShell('翻翻乐',\n        '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">🎴 翻翻乐<\\/span><span class=\"qbar qb2\">第 '+st.round+' / '+st.total+' 局<\\/span><\\/div>'\n        +'<div class=\"ask-t\">📋 翻开两张一样的图片就配对成功<\\/div>'\n        +'<div class=\"fl-grid\" style=\"margin-top:14px\">'+state.map(function(c,i){\n           var cls=c.open?'open':''; if(c.done) cls+=' done open';\n           return '<div class=\"flcard '+cls+'\" data-i=\"'+i+'\"><div class=\"in\"><div class=\"face back\">❓<\\/div><div class=\"face front\">'+pic(c.w,52)+'<span class=\"en\">'+esc(c.w.en)+'<\\/span><\\/div><\\/div><\\/div>';\n         }).join('')+'<\\/div>'\n        +'<div class=\"subnote\" style=\"margin-top:12px\">配对次数：'+st.moves+' 次<\\/div><\\/div>');\n      $$('.flcard').forEach(function(card){\n        card.onclick=function(){\n          if(lock) return;\n          var i=+card.dataset.i; var c=state[i];\n          if(c.done||c.open) return;\n          c.open=true; st.moves++; render(); openIt();\n        };\n      });\n    }\n    function openIt(){\n      var os=state.filter(function(c){return c.open&&!c.done;});\n      if(os.length<2) return;\n      lock=true;\n      if(os[0].w.en===os[1].w.en){\n        T(function(){\n          os[0].done=true; os[1].done=true; os[0].open=false; os[1].open=false;\n          sOk(); burst(40,40);\n          var left=state.filter(function(c){return !c.done;}).length;\n          if(left===0){ T(function(){ finishBoard(); },900); }\n          else{ lock=false; render(); }\n        },520);\n      }else{\n        T(function(){\n          os[0].open=false; os[1].open=false; sNo(); lock=false; render();\n        },800);\n      }\n    }\n    function finishBoard(){\n      if(st.round>=st.total){ endGame('翻翻乐'); return; }\n      st.round++;\n      paint('<div class=\"panel ac\" style=\"padding:40px\"><div style=\"font-size:80px\">🎉<\\/div><h2 style=\"font-size:30px\">这一局配对成功！<\\/h2><div class=\"row center\" style=\"margin-top:18px\"><button class=\"btn big\" id=\"nb\">▶ 下一局<\\/button><\\/div><\\/div>');\n      byId('nb').onclick=board;\n    }\n    render();\n  }\n  board();\n}\n/* ⑤ 听音打地鼠 */\nfunction sWhack(){\n  var st={n:0,total:10,ok:0,alive:true};\n  function round(){\n    if(!st.alive) return;\n    if(st.n>=st.total){ endGame('听音打地鼠'); return; }\n    st.n++;\n    var target=pickN(WORDS,1)[0];\n    var rest=shuffle(WORDS.filter(function(x){ return x.en!==target.en; })).slice(0,2);\n    var holes=shuffle([target].concat(rest));\n    var up=[]; holes.forEach(function(h,i){ if(i<holes.length) up.push(i); });\n    gameShell('听音打地鼠',\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">🔨 听音打地鼠<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+st.total+' 轮<\\/span><\\/div>'\n      +'<div class=\"ask-t\">🔊 仔细听，然后敲中那一只！<\\/div>'\n      +'<div class=\"ac\" style=\"margin:10px 0\"><button class=\"speak\" id=\"reWh\">🔊 再听一次<\\/button><\\/div>'\n      +'<div class=\"holes\">'+holes.map(function(h,i){ return '<div class=\"hole\" data-i=\"'+i+'\"><div class=\"mole\" data-i=\"'+i+'\">'+pic(h,54)+'<\\/div><\\/div>'; }).join('')+'<\\/div>'\n      +'<div class=\"scoreline\" style=\"margin-top:12px\">✅ 已敲对 '+st.ok+' 次<\\/div><\\ ems.map(function(){return false;});\n  function slotsHtml(round){\n    var w=st.items[st.cur]; var curFeat=w.en.toLowerCase();\n    var names=face?FACE_SLOTS[w.en.toLowerCase()]?[w.en.toLowerCase()]:[]:null;\n    var out='';\n    if(face){\n      Object.keys(FACE_SLOTS).forEach(function(feat){\n        var arr=FACE_SLOTS[feat];\n        arr.forEach(function(s,si){\n          var filled = (feat!=='eyes'&&feat!=='ears') ? st.done[st.items.findIndex(function(x){return x.en.toLowerCase()===feat;})] : st.done[st.items.findIndex(function(x){return x.en.toLowerCase()===feat;})];\n          var fillWord = st.done[st.items.findIndex(function(x){return x.en.toLowerCase()===feat;})] ? wByEn(feat) : null;\n          var hot = (feat===curFeat && !st.done[st.cur]) ? ' hot' : '';\n          var fcls = fillWord ? ' filled' : '';\n          out += '<div class=\"fslot '+s.cls+hot+fcls+'\" data-feat=\"'+feat+'\" style=\"left:'+s.x+';top:'+s.y+'\">'+(fillWord?'<span class=\"fi\">'+pic(fillWord,30)+'<\\/span>':'')+'<\\/div>';\n        });\n      });\n    }\n    return out;\n  }\n  function pieceIsDone(w){\n    var idx=st.items.findIndex(function(x){ return x.en===w.en; });\n    return idx>=0 && st.done[idx];\n  }\n  function render(){\n    if(!st.alive) return;\n    var w=st.items[st.cur];\n    var qline=(w && w.q)?'<div class=\"qline\">'+esc(w.q)+'<\\/div>':'';\n    var tip=(UNIT.sc&&UNIT.sc.tip)||'听一听，把它放到场景里';\n    var deco=(UNIT.sc&&UNIT.sc.deco)?UNIT.sc.deco.map(function(d){ return '<span class=\"deco\" style=\"left:'+d[0]+';top:'+d[1]+';font-size:'+(d[2]||40)+'px\">'+d[3]+'<\\/span>'; }).join(''):'';\n    var placedHtml=st.placed.map(function(p){ return '<span class=\"placed\" style=\"left:'+p.x+';top:'+p.y+'\">'+pic(p.w,44)+'<\\/span>'; }).join('');\n    var head='';\n    if(face){\n      head='<div class=\"pz-face\">'\n        +'<div class=\"body\"><\\/div><div class=\"neck\"><\\/div><div class=\"hair\"><\\/div><div class=\"head\"><\\/div>'\n        +slotsHtml(st.cur)+'<\\/div>';\n    }else{\n      head='<div class=\"pz-stage '+(UNIT.sc&&UNIT.sc.theme?UNIT.sc.theme:'')+'\" id=\"pzStage\">'+deco+placedHtml+'<\\/div>';\n    }\n    var piecesHtml=st.items.map(function(wi,i){\n      var used=st.done[i];\n      return '<button class=\"piece'+(used?' used':'')+'\" data-i=\"'+i+'\">'+pic(wi,54)+'<\\/button>';\n    }).join('');\n    gameShell('情景拼图',\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">🧩 情景拼图<\\/span><span class=\"qbar qb2\">第 '+(st.cur+1)+' / '+st.items.length+' 题<\\/span><\\/div>'\n      +qline\n      +'<div class=\"ask-t\">'+esc(tip)+'<\\/div>'\n      +'<div class=\"ac\" style=\"margin:10px 0\"><button class=\"speak\" id=\"puSpeak\">🔊 再听一次<\\/button><\\/div>'\n      +'<div class=\"face-wrap\">'+head+'<\\/div>'\n      +'<div class=\"pieces\">'+piecesHtml+'<\\/div><\\/div>');\n    byId('puSpeak').onclick=function(){ if(w) speak(wSay(w)); };\n    T(function(){ if(st.alive && w) speak(wSay(w)); },450);\n    bindPieces();\n    bindZone();\n  }\n  function bindPieces(){\n    $$('#screen .piece').forEach(function(p){\n      p.addEventListener('pointerdown',function(ev){\n        if(ev.cancelable) ev.preventDefault();\n        try{ p.setPointerCapture(ev.pointerId); }catch(e){}\n        var i=+p.dataset.i;\n        if(st.done[i]) return;\n        PUZ={i:i,px:ev.clientX,py:ev.clientY,drag:false,ghost:null,start:ev.clientX,startY:ev.clientY};\n        p.classList.add('sel');\n      });\n      p.addEventListener('pointermove',function(ev){\n        if(!PUZ||PUZ.drag) return;\n        if(Math.abs(ev.clientX-PUZ.start)>10||Math.abs(ev.clientY-PUZ.startY)>10){\n          PUZ.drag=true;\n          removeGhost();\n          var g=document.createElement('div'); g.className='dghost';\n          var w=st.items[PUZ.i];\n          g.innerHTML=pic(w,48);\n          document.body.appendChild(g); PUZ.ghost=g;\n        }\n        if(PUZ&&PUZ.ghost){ PUZ.ghost.style.left=ev.clientX+'px'; PUZ.ghost.style.top=ev.clientY+'px'; }\n      });\n      p.addEventListener('pointerup',function(ev){\n        if(!PUZ) return;\n        removeGhost();\n        var i=PUZ.i; var wasDrag=PUZ.drag;\n        var pEl=p; PUZ=null;\n        if(pEl.classList.contains('sel')) pEl.classList.remove('sel');\n        if(wasDrag){ _skipClick=true; tryPlace(i,ev.clientX,ev.clientY); }\n      });\n      p.addEventListener('click',function(ev){\n        if(_skipClick){ _skipClick=false; return; }\n        // 点击选中\n        var i=+p.dataset.i; if(st.done[i]) return;\n        var selEl=document.querySelector('.piece.sel');\n        if(selEl&&selEl!==p) selEl.classList.remove('sel');\n        p.classList.toggle('sel');\n        st.sel=(p.classList.contains('sel'))?i:null;\n      });\n    });\n  }\n  function bindZone(){\n    var stage=document.getElementById('pzStage');\n    if(stage){\n      stage.addEventListener('click',function(ev){\n        if(st.sel!==null){ tryPlace(st.sel,ev.clientX,ev.clientY); st.sel=null; }\n      });\n    }\n    if(face){\n      $$('#screen .fslot').forEach(function(s){\n        s.addEventListener('click',function(ev){\n          if(st.sel!==null){ tryPlaceSlot(st.sel,s.dataset.feat); st.sel=null; }\n        });\n      });\n    }\n  }\n  function wrongFeedback(w){\n    sNo();\n    toast('👂 先听一听，再找出 “'+esc(w.en)+'” 哦');\n    if(st.items[st.cur]) T(function(){ speak(wSay(st.items[st.cur])); },550);\n  }\n  function advance(){\n    st.cur++;\n    if(st.cur>=st.items.length){ st.alive=false; T(function(){ endGame('情景拼图'); },600); return; }\n    T(render,100);\n  }\n  function placeSuccess(w,x,y){\n    sOk(); burst(x,y);\n    speak(wSay(w));\n    var i=st.items.findIndex(function(x){return x.en===w.en;});\n    if(i>=0) st.done[i]=true;\n    st.placed.push({w:w,x:x,y:y});\n    advance();\n  }\n  function tryPlace(i,cx,cy){\n    if(!st.alive) return;\n    var w=st.items[i];\n    if(face){\n      var el=document.elementFromPoint(cx,cy);\n      if(!el) return;\n      var slot=el.closest?el.closest('.fslot'):null;\n      if(!slot){ toast('👆 拖到脸上对应的位置哦'); return; }\n      tryPlaceSlot(i,slot.dataset.feat);\n      return;\n    }\n    var stage=document.getElementById('pzStage');\n    if(!stage) return;\n    var r=stage.getBoundingClientRect();\n    if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom){\n      toast('👆 把它拖进场景里');\n      return;\n    }\n    if(w.en!==st.items[st.cur].en){ wrongFeedback(w); return; }\n    var x=Math.min(92,Math.max(7,(cx-r.left)/r.width*100)).toFixed(1);\n    var y=Math.min(90,Math.max(8,(cy-r.top)/r.height*100)).toFixed(1);\n    placeSuccess(w,x,y);\n  }\n  function tryPlaceSlot(i,feat){\n    if(!st.alive||st.done[i]) return;\n    var w=st.items[i];\n    var cur=st.items[st.cur];\n    if(w.en!==cur.en){ wrongFeedback(w); return; }\n    if(w.en.toLowerCase()===feat){\n      placeSuccess(w,'50%','30%');\n      render();\n    }else{\n      sNo();\n      toast('🤔 这个位置不是放它的地方哦');\n      T(function(){ if(st.alive) speak(wSay(cur)); },550);\n    }\n  }\n  render();\n}\n/* 引导页入口+启动 */\nwindow.addEventListener('load',function(){\n  bindTop();\n  showHome();\n});\n\n<\\/script>\n<\\/body>\n<\\/html>","BF1U4":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>Unit 4 · My Toys · 我的玩具<\\/title>\n<style>﻿/* Big Fun 合订课堂游戏 · 大屏版 */\n*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\nhtml,body{height:100%}\nbody{font-family:\"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",system-ui,sans-serif;background:#eef1f6;color:#1f2937;overflow-x:hidden}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}\n.hide{display:none!important}\n.screen{max-width:1160px;margin:0 auto;padding:14px}\n.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 3px 10px rgba(0,0,0,.07);margin-bottom:14px}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.center{justify-content: "\"}, {\"en\": \"on\", \"zh\": \"在上面\", \"svg\": \"<svg viewBox=\\\"0 0 64 64\\\"><path d=\\\"M4 52 L60 52\\\" stroke=\\\"#9ca3af\\\" stroke-width=\\\"3\\\"/><rect x=\\\"12\\\" y=\\\"30\\\" width=\\\"26\\\" height=\\\"22\\\" rx=\\\"3\\\" fill=\\\"#3b82f6\\\"/><circle cx=\\\"25\\\" cy=\\\"20\\\" r=\\\"8\\\" fill=\\\"#ef4444\\\"/><rect x=\\\"26\\\" y=\\\"18\\\" width=\\\"4\\\" height=\\\"6\\\" fill=\\\"#f59e0b\\\"/><\\/svg>\", \"icon\": \"\"}]};\n<\\/script>\n<script>/* Big Fun 合订课堂小游戏 · 引擎 */\n\"use strict\";\nvar UNIT = window.UNIT;\nvar WORDS = UNIT.words;\nvar AC = UNIT.accent || '#f97316';\nvar $ = function(s){ return document.querySelector(s); };\nvar $$ = function(s){ return Array.from(document.querySelectorAll(s)); };\nvar screenEl = $('#screen');\nvar PREFS_KEY = 'bigfun_v2_prefs';\nvar prefs = { voice:true, text:true };\ntry{ var _p = JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); if(_p){ prefs.voice = _p.voice!==false; prefs.text = _p.text!==false; } }catch(e){}\nfunction savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }\nfunction pickN(list,n){ return shuffle(list).slice(0,n); }\nfunction byId(id){ return document.getElementById(id); }\n/* 图片 HTML */\nfunction pic(w, fs){ if(w.svg){ return '<span class=\"sv\">'+w.svg+'<\\/span>'; } return '<span class=\"ic\" style=\"font-size:'+(fs||58)+'px\">'+esc(w.icon)+'<\\/span>'; }\nfunction lbl(w){ return prefs.text ? '<span class=\"en\">'+esc(w.en)+'<\\/span><span class=\"zh\">'+esc(w.zh)+'<\\/span>' : ''; }\n/* 语音 */\nvar _speechOk=false;\nfunction pickVoice(){ try{ var vs=speechSynthesis.getVoices().filter(function(v){return /en/i.test(v.lang);}); if(!vs.length) return null; return vs.find(function(v){return /en-US/i.test(v.lang)&&/(google|aria|zira|jenny|samantha|natural|siri)/i.test(v.name);})||vs[0]; }catch(e){ return null; } }\nif('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){ _speechOk=!!pickVoice(); }; setTimeout(function(){ _speechOk=!!pickVoice(); },400); }\nfunction speak(txt){ if(!prefs.voice||!txt) return; try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(txt)); u.lang='en-US'; u.rate=0.78; u.pitch=1.05; var v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }\nfunction stopSpeak(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }\nfunction wSay(w){ return (w && w.say) ? w.say : (w ? w.en : ''); }\n/* 音效 */\nvar actx=null;\nfunction beep(freq,t0,dur){ try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } var o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.setValueAtTime(.0001,actx.currentTime+t0); g.gain.exponentialRampToValueAtTime(.22,actx.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t0+dur); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+t0); o.stop(actx.currentTime+t0+dur+.05); }catch(e){} }\nfunction sOk(){ beep(660,0,.12); beep(880,.12,.2); }\nfunction sNo(){ beep(210,0,.32); }\nfunction sTick(){ beep(520,0,.06); }\n/* 定时器管理 */\nvar timers=[];\nfunction T(fn,ms){ var id=setTimeout(function(){ var i=timers.indexOf(id); if(i>=0) timers.splice(i,1); fn(); },ms); timers.push(id); return id; }\nfunction clearTimers(){ timers.forEach(function(t){ clearTimeout(t); }); timers=[]; }\n/* 弹窗反馈 */\nfunction toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },1600); }\nfunction burst(x,y){ var f=document.createElement('div'); f.className='fx'; var es=['⭐','✨','🎉','🌟','💛']; for(var k=0;k<14;k++){ var s=document.createElement('span'); s.style.left=((x!==undefined?x:30)+Math.random()*40)+'%'; s.style.top=(y!==undefined?y:20)+'%'; s.textContent=es[k%es.length]; f.appendChild(s); } document.body.appendChild(f); setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1100); }\nfunction paint(html){ screenEl.innerHTML=html; window.scrollTo(0,0); }\nfunction gameShell(title, html){ paint('<div class=\"ghead\"><span class=\"ht\">'+esc(title)+'<\\/span><\\/div>'+html); }\nvar curGame = null;\nfunction stopGame(){ clearTimers(); stopSpeak(); removeGhost(); PUZ=null; }\n/* 首页 */\nvar GAME_LIST=[\n {id:'lp',icon:'👂',name:'听音找图',desc:'听一听 · 找到对的图片'},\n {id:'miss',icon:'🙈',name:'谁不见了',desc:'认真记 · 谁偷偷溜走啦'},\n {id:'odd',icon:'🔍',name:'找不同',desc:'三张一样 · 找出不一样'},\n {id:'fl',icon:'🎴',name:'翻翻乐',desc:'翻开两张 · 图片配对'},\n {id:'wh',icon:'🔨',name:'听音打地鼠',desc:'听到什么 · 就敲哪一个'},\n {id:'pu',icon:'🧩',name:'情景拼图',desc:'听一听 · 拖到场景里'}\n];\nfunction showHome(){\n  stopGame(); curGame=null;\n  var gs=GAME_LIST.map(function(g){\n    return '<button class=\"game-card\" data-id=\"'+g.id+'\" style=\"--gc:'+AC+'\"><span class=\"gi\">'+g.icon+'<\\/span><span class=\"gn\">'+g.name+'<\\/span><span class=\"gd\">'+g.desc+'<\\/span><\\/button>';\n  }).join('');\n  var ws=WORDS.map(function(w){ return '<span class=\"wchip\">'+pic(w,46)+lbl(w)+'<\\/span>'; }).join('');\n  paint(\n    '<div class=\"home-top\"><div class=\"big\">'+UNIT.emoji+'<\\/div><div style=\"flex:1;min-width:220px\"><h2>'+esc(UNIT.name)+'<\\/h2><p>'+esc(UNIT.cn)+' · 全班一起玩，先点下面任一个小游戏<\\/p><\\/div><\\/div>'\n    +'<div class=\"game-grid\">'+gs+'<\\/div>'\n    +'<div class=\"panel\" style=\"margin-top:16px\"><div class=\"ht\" style=\"font-size:20px\">📖 本单元单词<\\/div><div class=\"word-grid\">'+ws+'<\\/div><\\/div>');\n  $$('.game-card').forEach(function(b){ b.onclick=function(){ startGame(b.dataset.id); }; });\n}\nfunction startGame(id){\n  var g=GAME_LIST.find(function(x){return x.id===id;}); if(!g) return;\n  curGame=id;\n  var intro=document.createElement('div');\n  paint('<div class=\"panel ac\" style=\"padding:36px 22px\"><div style=\"font-size:88px\">'+g.icon+'<\\/div><h2 style=\"font-size:32px;margin:10px 0\">'+esc(g.name)+'<\\/h2><p style=\"color:#6b7280;font-size:18px;margin:6px 0 4px\">'+esc(g.desc)+'<\\/p>'\n    +'<div style=\"color:#9ca3af;font-size:14px;margin-bottom:18px\">👂 可以随时点左上角 🏠 返回游戏列表<\\/div>'\n    +'<div class=\"row center\"><button class=\"btn big\" id=\"goStart\">▶ 开始游戏<\\/button><\\/div><\\/div>');\n  byId('goStart').onclick=function(){\n    if(id==='lp'){ sListen(); }\n    else if(id==='miss'){ sMissing(); }\n    else if(id==='odd'){ sOdd(); }\n    else if(id==='fl'){ sFlip(); }\n    else if(id==='wh'){ sWhack(); }\n    else if(id==='pu'){ sPuzzle(); }\n  };\n}\nfunction endGame(title){\n  stopGame();\n  burst();\n  gameShell('<span class=\"ht\">🎉<\\/span>',\n    '<div class=\"panel end\"><div class=\"em\">🎉<\\/div><h2>'+esc(title)+' 完成啦！<\\/h2>'\n    +'<p class=\"subnote\" style=\"font-size:18px\">大家合作得真棒！点左上角 🏠 可以随时换游戏<\\/p>'\n    +'<div class=\"endbtns\"><button class=\"btn\" id=\"againBtn\">🔁 再玩一次<\\/button><button class=\"btn ghost\" id=\"homeBtn\">🏠 换一个游戏<\\/button><\\/div><\\/div>');\n  var id=curGame;\n  byId('againBtn').onclick=function(){ startGame(id); };\n  byId('homeBtn').onclick=showHome;\n}\n/* 顶栏 */\nfunction bindTop(){\n  byId('btnHome').onclick=function(){ showHome(); };\n  byId('btnVoice').onclick=function(){ prefs.voice=!prefs.voice; savePrefs(); byId('btnVoice').classList.toggle('on',prefs.voice); toast(prefs.voice?'🔊 朗读已开':'🔇 朗读已关'); };\n  byId('btnText').onclick=function(){ prefs.text=!prefs.text; savePrefs(); byId('btnText').classList.toggle('on',prefs.text); toast(prefs.text?'👁 显示英文':'🙈 只显示图片'); if(curGame && curGame==='pu'){ sPuzzle(); } };\n  try{ byId('btnVoice').classList.toggle('on',prefs.voice); byId('btnText').classList.toggle('on',prefs.text); }catch(e){}\n}\n/* ① 听音找图 */\nfunction tapGame(cfg){\n  var st={n:0,lock:false,target:null,opts:[]};\n  function ask(){\n    if(st.n>=cfg.total){ endGame(cfg.name); return; }\n    st.n++; st.lock=false;\n    var t=pickN(WORDS,1)[0];\n    var rest=shuffle(WORDS.filter(function(x){ return x.en!==t.en; })).slice(0,3);\n    st.target=t; st.opts=shuffle([t].concat(rest));\n    render();\n    if(t.auto!==false) T(function(){ if(st.lock===false && !cfg.stopped) speak(wSay(t)); },700);\n  }\n  function render(){\n    var t=st.target;\n    var qline = (t.q) ? '<div class=\"qline\">'+esc(t.q)+'<\\/div>' : '';\n    gameShell(cfg.name,\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">'+cfg.ico+' '+cfg.name+'<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+cfg.total+' 题<\\/span><\\/div>'\n      +qline\n      +'<div class=\"ask-t\">'+cfg.tip+'<\\/div>'\n      +'<div class=\"ac\" style=\"margin:12px 0\"><button class=\"speak big\" id=\"reSpeak\">🔊<small>点我听<\\/small><\\/button><\\/div>'\n      +'<div class=\"opt-grid\">'+st.opts.map(function(w,i){ return '<button class=\"gcell\" data-i=\"'+i+'\"><span class=\"pic\">'+pic(w,72)+'<\\/span>'+lbl(w)+'<\\/button>'; }).join('')+'<\\/div><\\/div>');\n    byId('reSpeak').onclick=function(){ speak(wSay(t)); };\n    $$('.gcell').forEach(function(c){\n      c.onclick=function(){\n        if(st.lock) return;\n        var i=+c.dataset.i;\n        if(st.opts[i].en===t.en){\n          st.lock=true; c.classList.add('ok'); sOk(); burst(50,45);\n          speak(wSay(t));\n          T(function(){ if(!cfg.stopped) ask(); },1000);\n        }else{\n          c.classList.add('no'); sNo();\n          T(function(){ if(c.classList.contains('no')) c.classList.remove('no'); },400);\n          T(function(){ speak(wSay(t)); },650);\n        }\n      };\n    });\n  }\n  cfg.stopped=false;\n  ask();\n}\nfunction stopTap(cfg){ if(cfg) cfg.stopped=true; clearTimers(); }\nfunction sListen(){\n  var cfg={ico:'👂',name:'听音找图',tip:'听一听声音，再点出正确的图片',total:8};\n  var g={start:function(){ tapG div class=\"topbar\"><button class=\"tbtn\" id=\"btnHome\" title=\"返回游戏列表\">🏠<small>游戏列表<\\/small><\\/button><div class=\"ttl\"><span>🥪 Unit 5 · My Lunch<\\/span><span class=\"sub\">　Big Fun 1 · U5 · 我的午餐<\\/span><\\/div><button class=\"tbtn\" id=\"btnVoice\" title=\"朗读开关\">🔊<small>朗读<\\/small><\\/button><button class=\"tbtn\" id=\"btnText\" title=\"字幕开关\">👁️<small>字幕<\\/small><\\/button><\\/div>\n<div id=\"screen\"><\\/div>\n<script>window.UNIT = {\"key\": \"BF1U5\", \"book\": \"Big Fun 1\", \"num\": \"U5\", \"name\": \"Unit 5 · My Lunch\", \"cn\": \"我的午餐\", \"emoji\": \"🥪\", \"accent\": \"#f59e0b\", \"file\": \"BF1_U5_My_Lunch.html\", \"sc\": {\"theme\": \"sc-picnic\", \"face\": false, \"tip\": \"听一听，把好吃的放到野餐垫上\", \"items\": [\"sandwich\", \"lemonade\", \"carrots\", \"milk\", \"cookie\", \"apple\", \"banana\"], \"title\": \"\", \"deco\": [[86, 4, 54, \"☀️\"], [6, 8, 54, \"🌳\"], [60, 70, 56, \"🧺\"], [84, 72, 40, \"🌻\"], [30, 82, 40, \"🌼\"]]}, \"words\": [{\"en\": \"sandwich\", \"zh\": \"三明治\", \"icon\": \"🥪\"}, {\"en\": \"lemonade\", \"zh\": \"柠檬水\", \"svg\": \"<svg viewBox=\\\"0 0 64 64\\\"><path d=\\\"M12 8 L52 8 L46 58 L18 58 Z\\\" fill=\\\"rgba(255,255,255,.65)\\\" stroke=\\\"#9ca3af\\\" stroke-width=\\\"2\\\"/><path d=\\\"M16 24 L48 24 L43 58 L21 58 Z\\\" fill=\\\"#fde047\\\" stroke=\\\"#eab308\\\" stroke-width=\\\"1.5\\\"/><rect x=\\\"30\\\" y=\\\"14\\\" width=\\\"4\\\" height=\\\"8\\\" rx=\\\"2\\\" fill=\\\"#f59e0b\\\"/><circle cx=\\\"34\\\" cy=\\\"17\\\" r=\\\"2\\\" fill=\\\"#f59e0b\\\"/><path d=\\\"M8 34 q8 -6 16 0 M8 42 q8 -6 16 0\\\" stroke=\\\"#fde047\\\" stroke-width=\\\"3\\\" fill=\\\"none\\\" stroke-linecap=\\\"round\\\"/><circle cx=\\\"24\\\" cy=\\\"26\\\" r=\\\"7\\\" fill=\\\"#fde047\\\" stroke=\\\"#eab308\\\" stroke-width=\\\"2\\\"/><path d=\\\"M22 23 a7 7 0 0 1 4 -4\\\" stroke=\\\"#fff7cc\\\" stroke-width=\\\"2\\\" fill=\\\"none\\\"/><\\/svg>\", \"icon\": \"\"}, {\"en\": \"carrots\", \"zh\": \"胡萝卜\", \"icon\": \"🥕\"}, {\"en\": \"milk\", \"zh\": \"牛奶\", \"icon\": \"🥛\"}, {\"en\": \"cookie\", \"zh\": \"饼干\", \"icon\": \"🍪\"}, {\"en\": \"apple\", \"zh\": \"苹果\", \"icon\": \"🍎\"}, {\"en\": \"banana\", \"zh\": \"香蕉\", \"icon\": \"🍌\"}, {\"en\": \"bread\", \"zh\": \"面包\", \"icon\": \"🍞\"}, {\"en\": \"egg\", \"zh\": \"鸡蛋\", \"icon\": \"🥚\"}, {\"en\": \"cheese\", \"zh\": \"奶酪\", \"icon\": \"🧀\"}]};\n<\\/script>\n<script>/* Big Fun 合订课堂小游戏 · 引擎 */\n\"use strict\";\nvar UNIT = window.UNIT;\nvar WORDS = UNIT.words;\nvar AC = UNIT.accent || '#f97316';\nvar $ = function(s){ return document.querySelector(s); };\nvar $$ = function(s){ return Array.from(document.querySelectorAll(s)); };\nvar screenEl = $('#screen');\nvar PREFS_KEY = 'bigfun_v2_prefs';\nvar prefs = { voice:true, text:true };\ntry{ var _p = JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); if(_p){ prefs.voice = _p.voice!==false; prefs.text = _p.text!==false; } }catch(e){}\nfunction savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }\nfunction pickN(list,n){ return shuffle(list).slice(0,n); }\nfunction byId(id){ return document.getElementById(id); }\n/* 图片 HTML */\nfunction pic(w, fs){ if(w.svg){ return '<span class=\"sv\">'+w.svg+'<\\/span>'; } return '<span class=\"ic\" style=\"font-size:'+(fs||58)+'px\">'+esc(w.icon)+'<\\/span>'; }\nfunction lbl(w){ return prefs.text ? '<span class=\"en\">'+esc(w.en)+'<\\/span><span class=\"zh\">'+esc(w.zh)+'<\\/span>' : ''; }\n/* 语音 */\nvar _speechOk=false;\nfunction pickVoice(){ try{ var vs=speechSynthesis.getVoices().filter(function(v){return /en/i.test(v.lang);}); if(!vs.length) return null; return vs.find(function(v){return /en-US/i.test(v.lang)&&/(google|aria|zira|jenny|samantha|natural|siri)/i.test(v.name);})||vs[0]; }catch(e){ return null; } }\nif('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){ _speechOk=!!pickVoice(); }; setTimeout(function(){ _speechOk=!!pickVoice(); },400); }\nfunction speak(txt){ if(!prefs.voice||!txt) return; try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(txt)); u.lang='en-US'; u.rate=0.78; u.pitch=1.05; var v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }\nfunction stopSpeak(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }\nfunction wSay(w){ return (w && w.say) ? w.say : (w ? w.en : ''); }\n/* 音效 */\nvar actx=null;\nfunction beep(freq,t0,dur){ try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } var o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.setValueAtTime(.0001,actx.currentTime+t0); g.gain.exponentialRampToValueAtTime(.22,actx.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t0+dur); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+t0); o.stop(actx.currentTime+t0+dur+.05); }catch(e){} }\nfunction sOk(){ beep(660,0,.12); beep(880,.12,.2); }\nfunction sNo(){ beep(210,0,.32); }\nfunction sTick(){ beep(520,0,.06); }\n/* 定时器管理 */\nvar timers=[];\nfunction T(fn,ms){ var id=setTimeout(function(){ var i=timers.indexOf(id); if(i>=0) timers.splice(i,1); fn(); },ms); timers.push(id); return id; }\nfunction clearTimers(){ timers.forEach(function(t){ clearTimeout(t); }); timers=[]; }\n/* 弹窗反馈 */\nfunction toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },1600); }\nfunction burst(x,y){ var f=document.createElement('div'); f.className='fx'; var es=['⭐','✨','🎉','🌟','💛']; for(var k=0;k<14;k++){ var s=document.createElement('span'); s.style.left=((x!==undefined?x:30)+Math.random()*40)+'%'; s.style.top=(y!==undefined?y:20)+'%'; s.textContent=es[k%es.length]; f.appendChild(s); } document.body.appendChild(f); setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1100); }\nfunction paint(html){ screenEl.innerHTML=html; window.scrollTo(0,0); }\nfunction gameShell(title, html){ paint('<div class=\"ghead\"><span class=\"ht\">'+esc(title)+'<\\/span><\\/div>'+html); }\nvar curGame = null;\nfunction stopGame(){ clearTimers(); stopSpeak(); removeGhost(); PUZ=null; }\n/* 首页 */\nvar GAME_LIST=[\n {id:'lp',icon:'👂',name:'听音找图',desc:'听一听 · 找到对的图片'},\n {id:'miss',icon:'🙈',name:'谁不见了',desc:'认真记 · 谁偷偷溜走啦'},\n {id:'odd',icon:'🔍',name:'找不同',desc:'三张一样 · 找出不一样'},\n {id:'fl',icon:'🎴',name:'翻翻乐',desc:'翻开两张 · 图片配对'},\n {id:'wh',icon:'🔨',name:'听音打地鼠',desc:'听到什么 · 就敲哪一个'},\n {id:'pu',icon:'🧩',name:'情景拼图',desc:'听一听 · 拖到场景里'}\n];\nfunction showHome(){\n  stopGame(); curGame=null;\n  var gs=GAME_LIST.map(function(g){\n    return '<button class=\"game-card\" data-id=\"'+g.id+'\" style=\"--gc:'+AC+'\"><span class=\"gi\">'+g.icon+'<\\/span><span class=\"gn\">'+g.name+'<\\/span><span class=\"gd\">'+g.desc+'<\\/span><\\/button>';\n  }).join('');\n  var ws=WORDS.map(function(w){ return '<span class=\"wchip\">'+pic(w,46)+lbl(w)+'<\\/span>'; }).join('');\n  paint(\n    '<div class=\"home-top\"><div class=\"big\">'+UNIT.emoji+'<\\/div><div style=\"flex:1;min-width:220px\"><h2>'+esc(UNIT.name)+'<\\/h2><p>'+esc(UNIT.cn)+' · 全班一起玩，先点下面任一个小游戏<\\/p><\\/div><\\/div>'\n    +'<div class=\"game-grid\">'+gs+'<\\/div>'\n    +'<div class=\"panel\" style=\"margin-top:16px\"><div class=\"ht\" style=\"font-size:20px\">📖 本单元单词<\\/div><div class=\"word-grid\">'+ws+'<\\/div><\\/div>');\n  $$('.game-card').forEach(function(b){ b.onclick=function(){ startGame(b.dataset.id); }; });\n}\nfunction startGame(id){\n  var g=GAME_LIST.find(function(x){return x.id===id;}); if(!g) return;\n  curGame=id;\n  var intro=document.createElement('div');\n  paint('<div class=\"panel ac\" style=\"padding:36px 22px\"><div style=\"font-size:88px\">'+g.icon+'<\\/div><h2 style=\"font-size:32px;margin:10px 0\">'+esc(g.name)+'<\\/h2><p style=\"color:#6b7280;font-size:18px;margin:6px 0 4px\">'+esc(g.desc)+'<\\/p>'\n    +'<div style=\"color:#9ca3af;font-size:14px;margin-bottom:18px\">👂 可以随时点左上角 🏠 返回游戏列表<\\/div>'\n    +'<div class=\"row center\"><button class=\"btn big\" id=\"goStart\">▶ 开始游戏<\\/button><\\/div><\\/div>');\n  byId('goStart').onclick=function(){\n    if(id==='lp'){ sListen(); }\n    else if(id==='miss'){ sMissing(); }\n    else if(id==='odd'){ sOdd(); }\n    else if(id==='fl'){ sFlip(); }\n    else if(id==='wh'){ sWhack(); }\n    else if(id==='pu'){ sPuzzle(); }\n  };\n}\nfunction endGame(title){\n  stopGame();\n  burst();\n  gameShell('<span class=\"ht\">🎉<\\/span>',\n    '<div class=\"panel end\"><div class=\"em\">🎉<\\/div><h2>'+esc(title)+' 完成啦！<\\/h2>'\n    +'<p class=\"subnote\" style=\"font-size:18px\">大家合作得真棒！点左上角 🏠 可以随时换游戏<\\/p>'\n    +'<div class=\"endbtns\"><button class=\"btn\" id=\"againBtn\">🔁 再玩一次<\\/button><button class=\"btn ghost\" id=\"homeBtn\">🏠 换一个游戏<\\/button><\\/div><\\/div>');\n  var id=curGame;\n  byId('againBtn').onclick=function(){ startGame(id); };\n  byId('homeBtn').onclick=showHome;\n}\n/* 顶栏 */\nfunction bindTop(){\n  byId('btnHome').onclick=function(){ showHome(); };\n  byId('btnVoice').onclick=function(){ prefs.voice=!prefs.voice; savePrefs(); byId('btnVoice').classList.toggle('on',prefs.voice); toast(prefs.voice?'🔊 朗读已开':'🔇 朗读已关'); };\n  byId('btnText').onclick=function(){ prefs.text=!prefs.text; savePrefs(); byId('btnText').classList.toggle('on',prefs.text); toast(prefs.text?'👁 显示英文':'🙈 只显示图片'); if(curGame && curGame==='pu'){ sPuzzle(); } };\n  try{ byId('btnVoice').classList.toggle('on',prefs.voice); byId('btnText').classList.toggle('on',prefs.text); }catch(e){}\n}\n/* ① 听音找图 */\nfunction tapGame(cfg){\n  var st={n:0,lock:false,target:null,opts:[]};\n  function ask(){\n    if(st.n>=cfg.total){ endGame(cfg.name); return; }\n    st.n++; st.lock=false;\n    var t=pickN(WORDS,1)[0];\n    var rest=shuffle(WORDS.filter(function(x){ return x.en!==t.en; })).slice(0,3);\n    st.target=t; st.opts=shuffle([t].concat(rest));\n    render();\n    if(t.auto!==false) T(function(){ if(st.lock===false && !cfg.stopped) speak(wSay(t)); },700);\n  }\n  function render(){\n    var t=st.target;\n    var qline = (t.q) ? '<div class=\"qline\">'+esc(t.q)+'<\\/div>' : '';\n    gameShell(cfg.name,\n      '<div class=\"panel ask\"><div class=\"ghead\"><span class=\"ht\">'+cfg.ico+' '+cfg.name+'<\\/span><span class=\"qbar qb2\">第 '+st.n+' / '+cfg.total+' 题<\\/span><\\/div>'\n      +qline\n      +'<div class=\"ask-t\">'+cfg.tip+'<\\/div>'\n      +'<div class=\"ac\" style=\"margin:12px 0\"><button class=\"speak big\" id=\"reSpeak\">🔊<small>点我听<\\/small><\\/button><\\/div>'\n      +'<div class=\"opt-grid\">'+st.opts.map(function(w,i){ return '<button class=\"gcell\" data-i=\"'+i+'\"><span class=\"pic\">'+pic(w,72)+'<\\/span>'+lbl(w)+'<\\/button>'; }).join('')+'<\\/div><\\/div>');\n    byId('reSpeak').onclick=function(){ speak(wSay(t)); };\n    $$('.gcell').forEach(function(c){\n      c.onclick=function(){\n        if(st.lock) return;\n        var i=+c.dataset.i;\n        if(st.opts[i].en===t.en){\n          st.lock=true; c.classList.add('ok'); sOk(); burst(50,45);\n          speak(wSay(t));\n          T(function(){ if(!cfg.stopped) ask(); },1000);\n        }else{\n          c.classList.add('no'); sNo();\n          T(function(){ if(c.classList.contains('no')) c.classList.remove('no'); },400);\n          T(function(){ speak(wSay(t)); },650);\n        }\n      };\n    });\n  }\n  cfg.stopped=false;\n  ask();\n}\nfunction stopTap(cfg){ if(cfg) cfg.stopped=true; clearTimers(); }\nfunction sListen(){\n  var cfg={ico:'👂',name:'听音找图',tip:'听一听声音，再点出正确的图片',total:8};\n  var g={start:function(){ tapGame(cfg); },stop:function(){ stopTap(cfg); }};\n  GAME_CTX=g; g.start();\n}\n/* ② 谁不见了 */\nfunct ition:relative;width:360px;height:430px;background:transparent}\n.pz-face .head{position:absolute;left:50%;top:22px;width:250px;height:300px;transform:translateX(-50%);background:#ffd9a8;border:4px solid #d9a066;border-radius:48% 48% 42% 42%}\n.pz-face .hair{position:absolute;left:50%;top:10px;width:270px;height:120px;transform:translateX(-50%);background:#8b5a2b;border-radius:50% 50% 34% 34%}\n.pz-face .neck{position:absolute;left:50%;top:300px;width:70px;height:70px;transform:translateX(-50%);background:#ffd9a8;border:4px solid #d9a066;border-top:none;border-radius:0 0 20px 20px}\n.pz-face .body{position:absolute;left:50%;top:356px;width:220px;height:80px;transform:translateX(-50%);background:#60a5fa;border:4px solid #3b82f6;border-radius:22px}\n.fslot{position:absolute;z-index:5;border:4px dashed rgba(120,90,40,.75);background:rgba(255,255,255,.28);border-radius:14px;transition:.15s}\n.fslot.s-eye{width:58px;height:40px}\n.fslot.s-nose{width:44px;height:56px;border-radius:50%}\n.fslot.s-mouth{width:74px;height:34px}\n.fslot.s-ear{width:52px;height:44px}\n.fslot.hot{animation:pulse 1s infinite}\n.fslot .fi{width:100%;height:100%;display:flex;align-items:center;justify-content:center}\n.fslot .fi .ic{font-size:34px;line-height:1}\n.fslot .fi .sv{width:34px;height:34px}\n.fslot.filled{border-style:solid;border-color:#16a34a;background:#fff}\n\n/* 拼图碎片 */\n.pieces{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}\n.piece{width:120px;min-height:118px;background:#fff;border:4px solid #e5e7eb;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;transition:.12s;touch-action:none;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.06)}\n.piece .ic{font-size:56px;line-height:1}\n.piece .sv{width:62px;height:62px}\n.piece .en{font-size:15px;font-weight:800}\n.piece .zh{font-size:11px;color:#9ca3af}\n.piece.sel{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac);transform:scale(1.06)}\n
